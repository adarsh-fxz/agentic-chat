services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: python manage.py runserver 0.0.0.0:8000

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: celery -A config worker --loglevel=info

  beat:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: celery -A config beat --loglevel=info

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentic_chat
      POSTGRES_USER: agentic_chat
      POSTGRES_PASSWORD: agentic_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
